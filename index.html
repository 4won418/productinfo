<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANGOL PRODUCT INFO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<style>
  :root {
    --color-base: #111111;
    --color-bg: #F7F8FA;
    --color-card: #FFFFFF;
    --color-border: #E5E7EB;
    --color-text: #333333;
    --color-text-light: #666666;
    --status-primary: #2563EB;
    --status-primary-bg: #EAF1FE;
    --radius-card: 12px;
    --radius-input: 8px;
    --shadow-light: 0 2px 8px rgba(17,17,17,.08);
    --shadow-medium: 0 6px 18px rgba(17,17,17,.12);
    --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;
    --font-stack: "Pretendard","Noto Sans KR","Segoe UI",sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:var(--font-stack); background:var(--color-bg); color:var(--color-text); -webkit-font-smoothing:antialiased; }

  /* PC: 제목 바 + 필터 바가 각각 sticky로 붙어 하나처럼 보이며 전체가 고정된다.
     필터 바의 top 값은 제목 바의 실제 높이를 JS로 측정해 인라인으로 지정한다. */
  .topnav-title-bar { background:var(--color-card); padding:var(--sp-24) var(--sp-24) var(--sp-16); position:sticky; top:0; z-index:100; box-shadow:var(--shadow-light); }
  .topnav-title { font-size:24px; font-weight:800; margin:0; letter-spacing:.5px; color:var(--color-base); }
  .topnav-subtitle { font-size:12px; color:var(--color-text-light); margin-top:4px; font-weight:500; }

  .topnav-filters { background:var(--color-card); padding:0 var(--sp-24) var(--sp-24); border-bottom:1px solid var(--color-border); box-shadow:var(--shadow-light); position:sticky; top:0; z-index:99; }

  .filter-section { display:flex; flex-wrap:wrap; gap:var(--sp-24); align-items:flex-start; }
  .filter-group { display:flex; flex-direction:column; gap:var(--sp-8); min-width:220px; position:relative; }
  .filter-label { font-size:12px; font-weight:700; color:var(--color-text); text-transform:uppercase; letter-spacing:.5px; }

  .multi-select { display:flex; flex-wrap:wrap; gap:var(--sp-8); max-height:120px; overflow-y:auto; padding:var(--sp-8); background:#FAFBFC; border:1px solid var(--color-border); border-radius:var(--radius-input); }
  .multi-select-item { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--color-card); border:1px solid var(--color-border); border-radius:20px; font-size:12px; cursor:pointer; transition:all .2s; white-space:nowrap; user-select:none; }
  .multi-select-item:hover { background:var(--status-primary-bg); border-color:var(--status-primary); }
  .multi-select-item.active { background:var(--status-primary); color:#fff; border-color:var(--status-primary); }
  .multi-select-item input { cursor:pointer; width:14px; height:14px; margin:0; accent-color:var(--status-primary); }

  /* Dropdown-style multi-select (복종명) */
  .dropdown-select { position:relative; }
  .dropdown-trigger { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-input); font-size:13px; cursor:pointer; user-select:none; min-height:40px; }
  .dropdown-trigger:hover { border-color:var(--status-primary); }
  .dropdown-trigger.open { border-color:var(--status-primary); box-shadow:0 0 0 3px var(--status-primary-bg); }
  .dropdown-trigger-text { color:var(--color-text-light); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dropdown-trigger-text.has-value { color:var(--color-text); font-weight:600; }
  .dropdown-arrow { transition:transform .2s; color:var(--color-text-light); font-size:10px; }
  .dropdown-trigger.open .dropdown-arrow { transform:rotate(180deg); }
  .dropdown-panel { display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:280px; max-width:360px; max-height:320px; overflow-y:auto; background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-input); box-shadow:var(--shadow-medium); z-index:200; padding:var(--sp-8); }
  .dropdown-panel.open { display:block; }
  .dropdown-option { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  .dropdown-option:hover { background:var(--status-primary-bg); }
  .dropdown-option input { cursor:pointer; width:14px; height:14px; margin:0; accent-color:var(--status-primary); flex-shrink:0; }
  .dropdown-empty { padding:16px; text-align:center; color:var(--color-text-light); font-size:12px; }

  .search-input { flex:1; padding:10px var(--sp-12); border:1px solid var(--color-border); border-radius:var(--radius-input); font-family:inherit; font-size:13px; }
  .search-input:focus { outline:0; border-color:var(--status-primary); box-shadow:0 0 0 3px var(--status-primary-bg); }

  main { max-width:1400px; margin:0 auto; padding:var(--sp-24); }
  .results-info { font-size:13px; color:var(--color-text-light); padding:var(--sp-12) var(--sp-16); background:#FAFBFC; border-left:3px solid var(--status-primary); border-radius:6px; margin-bottom:var(--sp-16); }
  .results-info strong { color:var(--color-text); font-weight:700; }

  .products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:var(--sp-16); }
  .product-card { background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-card); overflow:hidden; cursor:pointer; transition:all .25s; box-shadow:var(--shadow-light); display:flex; flex-direction:column; }
  .product-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-medium); border-color:var(--status-primary); }
  .product-image { width:100%; aspect-ratio:1; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; font-size:12px; color:#999; }
  .product-image img { width:100%; height:100%; object-fit:contain; padding:12px; transition:transform .3s; }
  .product-card:hover .product-image img { transform:scale(1.05); }

  .product-info { padding:var(--sp-16); display:flex; flex-direction:column; gap:8px; flex:1; }
  .product-code { font-size:13px; font-weight:800; color:var(--color-base); letter-spacing:.3px; }
  .product-name { font-size:13px; font-weight:500; color:var(--color-text-light); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }

  .tag-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .tag { display:inline-flex; align-items:center; padding:4px 9px; background:#F1F3F5; color:var(--color-text); border-radius:6px; font-size:11px; font-weight:600; }
  .tag.tag-price { background:var(--status-primary-bg); color:var(--status-primary); }

  .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,.5); overflow-y:auto; padding:var(--sp-24); }
  .modal.active { display:flex; align-items:center; justify-content:center; }
  .modal-content { background:var(--color-card); padding:var(--sp-24); border-radius:var(--radius-card); max-width:920px; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-medium); width:100%; }
  .modal-header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--color-border); padding-bottom:var(--sp-16); margin-bottom:var(--sp-24); }
  .modal-title { font-size:19px; font-weight:800; margin:0; flex:1; }
  .modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:var(--color-text-light); padding:0; width:30px; height:30px; flex-shrink:0; }
  .modal-close:hover { color:var(--color-base); }

  .modal-body { display:grid; grid-template-columns:220px 1fr; gap:var(--sp-24); }
  .modal-image { width:220px; aspect-ratio:1; background:#fff; border-radius:var(--radius-card); overflow:hidden; display:flex; align-items:center; justify-content:center; position:sticky; top:10px; }
  .modal-image img { width:100%; height:100%; object-fit:contain; padding:12px; }

  .modal-details { display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-16) var(--sp-24); align-content:start; }
  .detail-group { display:flex; flex-direction:column; gap:6px; }
  .detail-group.full { grid-column:1/-1; }
  .detail-label { font-size:10px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.5px; }
  .detail-value { font-size:14px; color:var(--color-text); font-weight:600; line-height:1.5; }
  .detail-value.highlight { font-size:16px; font-weight:800; color:var(--status-primary); }

  .qty-section { grid-column:1/-1; margin-top:var(--sp-8); padding-top:var(--sp-16); border-top:1px solid var(--color-border); }
  .qty-section-title { font-size:13px; font-weight:700; color:var(--color-base); margin-bottom:var(--sp-12); display:flex; align-items:center; gap:6px; }
  .qty-table { width:100%; border-collapse:collapse; font-size:13px; }
  .qty-table th, .qty-table td { padding:8px 10px; text-align:center; border:1px solid var(--color-border); }
  .qty-table th { background:#FAFBFC; font-weight:700; color:var(--color-text-light); font-size:11px; text-transform:uppercase; }
  .qty-table td.color-cell { font-weight:700; text-align:left; background:#FAFBFC; }
  .qty-table tr.total-row td { font-weight:800; background:var(--status-primary-bg); color:var(--status-primary); }

  .loading, .empty-state { text-align:center; padding:var(--sp-48); color:var(--color-text-light); }
  .loading-spinner { display:inline-block; width:40px; height:40px; border:3px solid var(--status-primary-bg); border-top-color:var(--status-primary); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:var(--sp-16); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .empty-state-icon { font-size:48px; margin-bottom:var(--sp-16); }

  @media (max-width:768px) {
    /* 모바일: 제목만 고정, 필터는 일반 문서 흐름을 따라 스크롤되어 자연스럽게 사라진다 */
    .topnav-title-bar { padding:var(--sp-16) var(--sp-16) var(--sp-12); }
    .topnav-filters { position:static; box-shadow:none; padding:var(--sp-12) var(--sp-16) var(--sp-16); top:auto; }
    .filter-section { flex-direction:column; gap:var(--sp-12); }
    .filter-group { width:100%; min-width:auto; }
    .products-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:var(--sp-12); }
    .modal-body { grid-template-columns:1fr; }
    .modal-image { width:100%; max-width:280px; margin:0 auto; position:static; }
    .modal-details { grid-template-columns:1fr; }
    .modal-content { width:95%; padding:var(--sp-16); }
    .qty-table { font-size:11px; }
    /* iOS Safari는 입력창 font-size가 16px보다 작으면 포커스 시 자동으로 화면을 확대한다 */
    .search-input { font-size:16px; }
  }
</style>
</head>
<body>
  <div class="topnav-title-bar">
    <div class="topnav-title-wrap">
      <div class="topnav-title">KANGOL PRODUCT INFO</div>
      <div class="topnav-subtitle">상품기준 : 2024년-2026년</div>
    </div>
  </div>

  <div class="topnav-filters">
    <div class="filter-section">
      <div class="filter-group">
        <label class="filter-label">년도</label>
        <div class="multi-select" id="yearFilter"></div>
      </div>

      <div class="filter-group">
        <label class="filter-label">시즌</label>
        <div class="multi-select" id="seasonFilter"></div>
      </div>

      <div class="filter-group">
        <label class="filter-label">기획명</label>
        <div class="multi-select" id="planningFilter"></div>
      </div>

      <div class="filter-group dropdown-select" id="categoryDropdownWrap">
        <label class="filter-label">복종명</label>
        <div class="dropdown-trigger" id="categoryTrigger" onclick="toggleCategoryDropdown()">
          <span class="dropdown-trigger-text" id="categoryTriggerText">전체</span>
          <span class="dropdown-arrow">▼</span>
        </div>
        <div class="dropdown-panel" id="categoryPanel"></div>
      </div>

      <div class="filter-group">
        <label class="filter-label">검색</label>
        <input type="text" class="search-input" id="searchInput" placeholder="수입품번, 품번, 품명, 기획명, 복종명...">
      </div>
    </div>
  </div>

  <main>
    <div class="results-info">총 <strong id="totalCount">0</strong>개 상품 중 <strong id="filteredCount">0</strong>개 표시</div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div>상품 데이터를 불러오는 중...</div>
    </div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="empty-state-icon">📭</div>
      <div>검색 결과가 없습니다.</div>
    </div>
  </main>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-image" id="modalImage"></div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

<script>
  let rawRows = [];
  let allProducts = [];
  let filteredProducts = [];
  let planningCategoryMap = {};

  let filters = {
    years: new Set(),
    seasons: new Set(),
    plannings: new Set(),
    categories: new Set(),
    search: ''
  };

  // 정렬 우선순위: 목록에 없는 값은 뒤로 밀려 알파벳/가나다순으로 붙는다
  const SEASON_ORDER = ['봄/여름', '가을/겨울'];
  const PLANNING_ORDER = ['가방', '의류', '의류(여성)', '모자'];

  function sortByOrder(items, order) {
    return [...items].sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
  }

  const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/4won418/productinfo/main';
  const IMAGE_BASE_PATH = GITHUB_RAW_URL + '/product-images';

  async function loadData() {
    try {
      const res = await fetch(GITHUB_RAW_URL + '/product_data.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      rawRows = await res.json();

      allProducts = groupByProductCode(rawRows);
      planningCategoryMap = buildPlanningCategoryMap(rawRows);

      console.log('✓ 원본 행: ' + rawRows.length + ', 그룹화된 품번: ' + allProducts.length);

      document.getElementById('loadingState').style.display = 'none';
      initializeFilters();
      applyFilters();
    } catch (err) {
      console.error('데이터 로드 실패:', err);
      document.getElementById('loadingState').innerHTML = '<div class="empty-state-icon">⚠️</div><div>데이터를 불러올 수 없습니다.</div>';
    }
  }

  // 품번 단위로 그룹화. 같은 품번의 색상/사이즈 행은 하나의 카드로 합치고,
  // 발주수량/입고수량은 색상별로 합산해 colorVariants 에 저장한다.
  function groupByProductCode(rows) {
    const groups = {};
    rows.forEach(row => {
      const code = row.품번;
      if (!code) return;

      if (!groups[code]) {
        groups[code] = {
          브랜드명: row.브랜드명,
          년도명: row.년도명,
          시즌명: row.시즌명,
          기획명: row.기획명 === '수입모자' ? '모자' : row.기획명,
          복종명: row.복종명,
          수입품번: row.수입품번,
          품번: row.품번,
          품명: row.품명,
          발주처명: row.발주처명,
          원산지명: row.원산지명,
          디자이너: row.디자이너,
          최초가: row.최초가,
          택가: row.택가,
          '사후원가(V+)': row['사후원가(V+)'],
          최초입고일: row.최초입고일,
          최초출고일: row.최초출고일,
          colorVariants: {}
        };
      }

      const color = row.색상 || '기타';
      const g = groups[code];
      if (!g.colorVariants[color]) {
        g.colorVariants[color] = { 발주수량: 0, 입고수량: 0 };
      }
      g.colorVariants[color].발주수량 += Number(row.발주수량) || 0;
      g.colorVariants[color].입고수량 += Number(row.입고수량) || 0;
    });
    return Object.values(groups);
  }

  // 기획명 -> 그에 속하는 복종명 목록 매핑 생성
  function buildPlanningCategoryMap(rows) {
    const map = {};
    rows.forEach(row => {
      if (!row.기획명 || !row.복종명) return;
      const planning = row.기획명 === '수입모자' ? '모자' : row.기획명;
      if (!map[planning]) map[planning] = new Set();
      map[planning].add(row.복종명);
    });
    const result = {};
    Object.keys(map).forEach(k => { result[k] = [...map[k]].sort(); });
    return result;
  }

  function getAvailableCategories() {
    // 기획명이 선택되지 않았으면 전체 복종명, 선택되었으면 해당 기획명들에 속한 복종명만
    if (filters.plannings.size === 0) {
      const all = new Set();
      Object.values(planningCategoryMap).forEach(list => list.forEach(c => all.add(c)));
      return [...all].sort();
    }
    const result = new Set();
    filters.plannings.forEach(p => {
      (planningCategoryMap[p] || []).forEach(c => result.add(c));
    });
    return [...result].sort();
  }

  function initializeFilters() {
    const years = [...new Set(allProducts.map(p => p.년도명).filter(Boolean))].sort();
    const seasons = sortByOrder([...new Set(allProducts.map(p => p.시즌명).filter(Boolean))], SEASON_ORDER);
    const plannings = sortByOrder([...new Set(allProducts.map(p => p.기획명).filter(Boolean))], PLANNING_ORDER);

    renderFilter('yearFilter', years, 'years');
    renderFilter('seasonFilter', seasons, 'seasons');
    renderFilter('planningFilter', plannings, 'plannings');
    renderCategoryDropdown();
  }

  function renderFilter(containerId, items, filterKey) {
    const container = document.getElementById(containerId);
    container.innerHTML = items.map(item => `
      <label class="multi-select-item" data-filter="${filterKey}" data-value="${item}">
        <input type="checkbox" value="${item}" onchange="toggleFilter('${filterKey}', '${item}', this.checked)">
        <span>${item}</span>
      </label>
    `).join('');
  }

  function toggleFilter(filterKey, value, checked) {
    if (checked) filters[filterKey].add(value);
    else filters[filterKey].delete(value);

    const el = document.querySelector(`[data-filter="${filterKey}"][data-value="${CSS.escape(value)}"]`);
    if (el) el.classList.toggle('active', checked);

    if (filterKey === 'plannings') {
      // 기획명이 바뀌면 복종명 선택 중 더는 유효하지 않은 항목 제거
      const available = new Set(getAvailableCategories());
      [...filters.categories].forEach(c => {
        if (!available.has(c)) filters.categories.delete(c);
      });
      renderCategoryDropdown();
    }

    applyFilters();
  }

  // ---- 복종명 드롭다운 ----
  function renderCategoryDropdown() {
    const panel = document.getElementById('categoryPanel');
    const options = getAvailableCategories();

    if (options.length === 0) {
      panel.innerHTML = '<div class="dropdown-empty">선택 가능한 복종명이 없습니다</div>';
    } else {
      panel.innerHTML = options.map(opt => `
        <label class="dropdown-option">
          <input type="checkbox" value="${opt}" ${filters.categories.has(opt) ? 'checked' : ''} onchange="toggleCategoryOption('${opt}', this.checked)">
          <span>${opt}</span>
        </label>
      `).join('');
    }

    updateCategoryTriggerText();
  }

  function toggleCategoryOption(value, checked) {
    if (checked) filters.categories.add(value);
    else filters.categories.delete(value);
    updateCategoryTriggerText();
    applyFilters();
  }

  function updateCategoryTriggerText() {
    const textEl = document.getElementById('categoryTriggerText');
    if (filters.categories.size === 0) {
      textEl.textContent = '전체';
      textEl.classList.remove('has-value');
    } else if (filters.categories.size === 1) {
      textEl.textContent = [...filters.categories][0];
      textEl.classList.add('has-value');
    } else {
      textEl.textContent = filters.categories.size + '개 선택됨';
      textEl.classList.add('has-value');
    }
  }

  function toggleCategoryDropdown() {
    document.getElementById('categoryTrigger').classList.toggle('open');
    document.getElementById('categoryPanel').classList.toggle('open');
  }

  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('categoryDropdownWrap');
    if (!wrap.contains(e.target)) {
      document.getElementById('categoryTrigger').classList.remove('open');
      document.getElementById('categoryPanel').classList.remove('open');
    }
  });

  // ---- 검색 ----
  document.getElementById('searchInput').addEventListener('input', (e) => {
    filters.search = e.target.value.toLowerCase().trim();
    applyFilters();
  });

  function applyFilters() {
    filteredProducts = allProducts.filter(p => {
      if (filters.years.size > 0 && !filters.years.has(p.년도명)) return false;
      if (filters.seasons.size > 0 && !filters.seasons.has(p.시즌명)) return false;
      if (filters.plannings.size > 0 && !filters.plannings.has(p.기획명)) return false;
      if (filters.categories.size > 0 && !filters.categories.has(p.복종명)) return false;

      if (filters.search) {
        const fields = [p.수입품번, p.품번, p.품명, p.기획명, p.복종명];
        const matches = fields.some(f => f && String(f).toLowerCase().includes(filters.search));
        if (!matches) return false;
      }
      return true;
    });
    updateResults();
  }

  function updateResults() {
    const grid = document.getElementById('productsGrid');
    const emptyState = document.getElementById('emptyState');

    document.getElementById('totalCount').textContent = allProducts.length;
    document.getElementById('filteredCount').textContent = filteredProducts.length;

    if (filteredProducts.length === 0) {
      grid.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    grid.style.display = 'grid';
    emptyState.style.display = 'none';

    grid.innerHTML = filteredProducts.map((p, idx) => {
      const seasonFolder = getSeasonFolder(p);
      const imageFile = `${IMAGE_BASE_PATH}/${seasonFolder}/${p.품번}.jpg`;

      return `
        <div class="product-card" onclick="openModal(${idx})">
          <div class="product-image">
            <img src="${imageFile}" alt="${p.품명}" loading="lazy" onerror="this.parentElement.innerHTML='이미지 없음'">
          </div>
          <div class="product-info">
            <div class="product-code">${p.품번}</div>
            <div class="product-name">${p.품명 || ''}</div>
            <div class="tag-row">
              <span class="tag">${p.기획명 || '-'}</span>
              <span class="tag">${p.복종명 || '-'}</span>
              <span class="tag">${p.수입품번 || '-'}</span>
              <span class="tag tag-price">₩${formatPrice(p.최초가)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // 년도명(2024)+시즌명(봄/여름 또는 가을/겨울) -> 이미지 폴더명(24SS, 24AW)
  function getSeasonFolder(p) {
    const yearShort = String(p.년도명 || '').slice(-2);
    const seasonCode = (p.시즌명 || '').includes('봄') ? 'SS' : 'AW';
    return yearShort + seasonCode;
  }

  function formatPrice(price) {
    if (!price && price !== 0) return '0';
    const n = parseInt(price);
    return isNaN(n) ? '0' : n.toLocaleString('ko-KR');
  }

  function openModal(index) {
    const p = filteredProducts[index];
    const seasonFolder = getSeasonFolder(p);
    const imageFile = `${IMAGE_BASE_PATH}/${seasonFolder}/${p.품번}.jpg`;

    document.getElementById('modalTitle').textContent = `${p.품번} — ${p.품명 || ''}`;
    document.getElementById('modalImage').innerHTML = `<img src="${imageFile}" alt="${p.품명}" onerror="this.parentElement.textContent='이미지 없음'">`;

    document.getElementById('modalDetails').innerHTML = renderDetailGroups(p);

    document.getElementById('detailModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function renderDetailGroups(p) {
    const details = [
      { label: '시즌명', value: p.시즌명 },
      { label: '년도명', value: p.년도명 },
      { label: '기획명', value: p.기획명 },
      { label: '복종명', value: p.복종명 },
      { label: '수입품번', value: p.수입품번 },
      { label: '품번', value: p.품번 },
      { label: '품명', value: p.품명, full: true },
      { label: '발주처명', value: p.발주처명 },
      { label: '원산지명', value: p.원산지명 },
      { label: '디자이너', value: p.디자이너 },
      { label: '최초가', value: `₩${formatPrice(p.최초가)}`, highlight: true },
      { label: '택가', value: `₩${formatPrice(p.택가)}` },
      { label: '사후원가(V+)', value: `₩${formatPrice(p['사후원가(V+)'])}` },
      { label: '최초입고일', value: p.최초입고일 },
      { label: '최초출고일', value: p.최초출고일 }
    ];

    const detailsHtml = details.map(d => `
      <div class="detail-group ${d.full ? 'full' : ''}">
        <div class="detail-label">${d.label}</div>
        <div class="detail-value ${d.highlight ? 'highlight' : ''}">${d.value || '-'}</div>
      </div>
    `).join('');

    const qtyHtml = renderQtyTable(p.colorVariants);

    return detailsHtml + qtyHtml;
  }

  function renderQtyTable(colorVariants) {
    const colors = Object.keys(colorVariants || {}).sort();
    if (colors.length === 0) return '';

    let totalOrder = 0, totalReceive = 0;
    const rows = colors.map(color => {
      const v = colorVariants[color];
      totalOrder += v.발주수량;
      totalReceive += v.입고수량;
      return `
        <tr>
          <td class="color-cell">${color}</td>
          <td>${v.발주수량.toLocaleString('ko-KR')}</td>
          <td>${v.입고수량.toLocaleString('ko-KR')}</td>
        </tr>
      `;
    }).join('');

    return `
      <div class="qty-section">
        <div class="qty-section-title">📦 색상별 발주 · 입고 수량</div>
        <table class="qty-table">
          <thead>
            <tr><th>색상</th><th>발주수량</th><th>입고수량</th></tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="total-row">
              <td>TOTAL</td>
              <td>${totalOrder.toLocaleString('ko-KR')}</td>
              <td>${totalReceive.toLocaleString('ko-KR')}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  }

  function closeModal() {
    document.getElementById('detailModal').classList.remove('active');
    document.body.style.overflow = 'auto';
  }

  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // PC에서 제목 바 바로 아래에 필터 바가 딱 붙어 고정되도록, 제목 바의 실제 높이를
  // 측정해 필터 바의 top 값으로 지정한다 (모바일에서는 필터가 static이라 top이 무시됨).
  function syncFilterStickyOffset() {
    const titleBar = document.querySelector('.topnav-title-bar');
    const filters = document.querySelector('.topnav-filters');
    filters.style.top = titleBar.offsetHeight + 'px';
  }
  window.addEventListener('resize', syncFilterStickyOffset);
  window.addEventListener('load', syncFilterStickyOffset);
  syncFilterStickyOffset();

  window.addEventListener('load', loadData);
</script>
</body>
</html>
