<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 정보 맵</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <style>
    :root { --color-base:#111; --color-bg:#F7F8FA; --color-card:#FFF; --color-border:#E5E7EB; --color-text:#333; --color-text-light:#666; --status-primary:#2563EB; --status-primary-bg:#EAF1FE; --radius-card:12px; --radius-input:8px; --shadow-light:0 2px 8px rgba(17,17,17,.08); --shadow-medium:0 6px 18px rgba(17,17,17,.12); --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-24:24px; --sp-32:32px; --font-stack:"Pretendard","Noto Sans KR",sans-serif; }*{box-sizing:border-box}body{margin:0;font-family:var(--font-stack);background:var(--color-bg);color:var(--color-text)}.topnav{background:var(--color-card);border-bottom:1px solid var(--color-border);padding:var(--sp-24);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-light)}.topnav-title{font-size:24px;font-weight:700;margin:0 0 var(--sp-24) 0}.filter-section{display:flex;flex-wrap:wrap;gap:var(--sp-24);margin-bottom:var(--sp-24)}.filter-group{display:flex;flex-direction:column;gap:var(--sp-8);min-width:240px}.filter-label{font-size:13px;font-weight:600;text-transform:uppercase}.multi-select{display:flex;flex-wrap:wrap;gap:var(--sp-8);max-height:120px;overflow-y:auto;padding:var(--sp-8);background:#FAFBFC;border:1px solid var(--color-border);border-radius:var(--radius-input)}.multi-select-item{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--color-card);border:1px solid var(--color-border);border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s}.multi-select-item:hover{background:var(--status-primary-bg);border-color:var(--status-primary)}.multi-select-item.active{background:var(--status-primary);color:#fff}.multi-select-item input{cursor:pointer;width:14px;height:14px;margin:0}.search-input{flex:1;padding:10px var(--sp-12);border:1px solid var(--color-border);border-radius:var(--radius-input);font-family:inherit}.search-input:focus{outline:0;border-color:var(--status-primary);box-shadow:0 0 0 3px var(--status-primary-bg)}main{max-width:1400px;margin:0 auto;padding:var(--sp-24)}.results-info{font-size:13px;color:var(--color-text-light);padding:var(--sp-12) var(--sp-16);background:#FAFBFC;border-left:3px solid var(--status-primary)}.results-info strong{color:var(--color-text);font-weight:600}.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-16)}.product-card{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-card);cursor:pointer;transition:all .3s;box-shadow:var(--shadow-light)}.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-medium);border-color:var(--status-primary)}.product-image{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#f5f5f5,#eee);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.product-image img{width:100%;height:100%;object-fit:cover}.product-card:hover .product-image img{transform:scale(1.05)}.product-info{padding:var(--sp-16)}.product-sku{font-size:11px;color:var(--status-primary);font-weight:600;margin-bottom:4px}.product-name{font-size:14px;font-weight:600;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.product-meta{display:flex;flex-direction:column;gap:6px;font-size:12px;margin-bottom:var(--sp-12)}.product-meta-item{display:flex;justify-content:space-between}.product-meta-label{font-weight:500;color:#888}.product-meta-value{font-weight:600}.product-price{padding-top:var(--sp-12);border-top:1px solid var(--color-border);font-size:16px;font-weight:700;color:var(--status-primary)}.modal{display:none;position:fixed;z-index:1000;width:100%;height:100%;background:rgba(0,0,0,.5);overflow-y:auto;padding:var(--sp-24)}.modal.active{display:flex;align-items:center;justify-content:center}.modal-content{background:var(--color-card);padding:var(--sp-24);border-radius:var(--radius-card);max-width:900px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-medium)}.modal-header{display:flex;justify-content:space-between;border-bottom:1px solid var(--color-border);padding-bottom:var(--sp-16);margin-bottom:var(--sp-24)}.modal-title{font-size:20px;font-weight:700;margin:0;flex:1}.modal-close{background:0;border:none;font-size:24px;cursor:pointer;color:var(--color-text-light);padding:0;width:30px;height:30px}.modal-close:hover{color:var(--color-base)}.modal-body{display:grid;grid-template-columns:220px 1fr;gap:var(--sp-24)}.modal-image{width:220px;aspect-ratio:1;background:#f5f5f5;border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;position:sticky;top:10px}.modal-image img{width:100%;height:100%;object-fit:cover}.modal-details{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16) var(--sp-24)}.detail-group{display:flex;flex-direction:column;gap:var(--sp-8)}.detail-group.full{grid-column:1/-1}.detail-label{font-size:11px;font-weight:600;color:#888;text-transform:uppercase}.detail-value{font-size:14px;color:var(--color-text);font-weight:500;line-height:1.5}.detail-value.highlight{font-size:16px;font-weight:700;color:var(--status-primary)}.empty-state{text-align:center;padding:var(--sp-48);color:var(--color-text-light)}.empty-state-icon{font-size:48px;margin-bottom:var(--sp-16)}@media(max-width:768px){.products-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.modal-body{grid-template-columns:1fr}.modal-image{width:100%;max-width:300px;position:static}.modal-details{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="topnav">
    <div class="topnav-title">📦 상품 정보 맵</div>
    <div class="filter-section">
      <div class="filter-group">
        <label class="filter-label">🗓️ 시즌</label>
        <div class="multi-select" id="seasonFilter"></div>
      </div>
      <div class="filter-group">
        <label class="filter-label">🎯 기획명</label>
        <div class="multi-select" id="planningFilter"></div>
      </div>
      <div class="filter-group">
        <label class="filter-label">📂 복종명</label>
        <div class="multi-select" id="categoryFilter"></div>
      </div>
      <div class="filter-group">
        <label class="filter-label">🔍 검색</label>
        <input type="text" class="search-input" id="searchInput" placeholder="수입품번, 품번, 품명...">
      </div>
    </div>
  </div>
  <main>
    <div class="results-info">총 <strong id="totalCount">0</strong>개 상품 중 <strong id="filteredCount">0</strong>개 표시</div>
    <div class="products-grid" id="productsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;"><div class="empty-state-icon">📭</div><div>검색 결과가 없습니다.</div></div>
  </main>
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header"><h2 class="modal-title" id="modalTitle"></h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
      <div class="modal-body"><div class="modal-image" id="modalImage"></div><div class="modal-details" id="modalDetails"></div></div>
    </div>
  </div>
  <script>
    let allProducts=[],filteredProducts=[],filters={seasons:new Set(),plannings:new Set(),categories:new Set(),search:''};
    const GITHUB_RAW_URL='https://raw.githubusercontent.com/4won418/productinfo/main',IMAGE_BASE_PATH=GITHUB_RAW_URL+'/상품기초정보_2024_2026';
    async function loadData(){try{const e=await fetch(GITHUB_RAW_URL+'/product_data.json');if(!e.ok)throw new Error('HTTP '+e.status);allProducts=await e.json(),console.log('✓ '+allProducts.length+'개 상품 로드됨'),initializeFilters(),applyFilters()}catch(e){console.error('실패:',e),document.getElementById('emptyState').innerHTML='<div class="empty-state-icon">⚠️</div><div>데이터 로드 실패</div>'}}
    function initializeFilters(){const e=[...new Set(allProducts.map(e=>e.시즌명).filter(Boolean))].sort(),t=[...new Set(allProducts.map(e=>e.기획명).filter(Boolean))].sort(),a=[...new Set(allProducts.map(e=>e.복종명).filter(Boolean))].sort();renderFilter('seasonFilter',e,'seasons'),renderFilter('planningFilter',t,'plannings'),renderFilter('categoryFilter',a,'categories')}
    function renderFilter(e,t,a){document.getElementById(e).innerHTML=t.map(t=>'<label class="multi-select-item" data-value="'+t+'"><input type="checkbox" value="'+t+'" onchange="toggleFilter(\''+a+'\', \''+t+'\', this.checked)"><span>'+t+'</span></label>').join('')}
    function toggleFilter(e,t,a){a?(filters[e].add(t),document.querySelector('[data-value="'+t+'"]').classList.add('active')):(filters[e].delete(t),document.querySelector('[data-value="'+t+'"]').classList.remove('active')),applyFilters()}
    document.getElementById('searchInput').addEventListener('input',e=>{filters.search=e.target.value.toLowerCase().trim(),applyFilters()});
    function applyFilters(){filteredProducts=allProducts.filter(e=>{if(filters.seasons.size>0&&!filters.seasons.has(e.시즌명))return!1;if(filters.plannings.size>0&&!filters.plannings.has(e.기획명))return!1;if(filters.categories.size>0&&!filters.categories.has(e.복종명))return!1;if(filters.search){const t=[e.수입품번,e.품번,e.품명,e.기획명,e.복종명].some(e=>e&&e.toLowerCase().includes(filters.search));if(!t)return!1}return!0}),updateResults()}
    function updateResults(){const e=document.getElementById('productsGrid'),t=document.getElementById('emptyState');document.getElementById('totalCount').textContent=allProducts.length,document.getElementById('filteredCount').textContent=filteredProducts.length,0===filteredProducts.length?(e.style.display='none',t.style.display='block'):(e.style.display='grid',t.style.display='none',e.innerHTML=filteredProducts.map((e,t)=>{const a=e.시즌명.replace('/',''),o=IMAGE_BASE_PATH+'/'+a+'/'+e.품번+'.jpg';return'<div class="product-card" onclick="openModal('+t+')"><div class="product-image"><img src="'+o+'" alt="'+e.품명+'" onerror="this.parentElement.innerHTML=\'이미지 없음\'"></div><div class="product-info"><div class="product-sku">'+e.수입품번+'</div><div class="product-name">'+e.품명+'</div><div class="product-meta"><div class="product-meta-item"><span class="product-meta-label">기획</span><span class="product-meta-value">'+e.기획명+'</span></div><div class="product-meta-item"><span class="product-meta-label">복종</span><span class="product-meta-value">'+e.복종명+'</span></div></div><div class="product-price">₩'+formatPrice(e.최초가)+'</div></div></div>'}).join(''))}
    function formatPrice(e){if(!e)return'0';const t=parseInt(e);return isNaN(t)?'0':t.toLocaleString('ko-KR')}
    function openModal(e){const t=filteredProducts[e],a=t.시즌명.replace('/',''),o=IMAGE_BASE_PATH+'/'+a+'/'+t.품번+'.jpg';document.getElementById('modalTitle').textContent=t.품명,document.getElementById('modalImage').innerHTML='<img src="'+o+'" alt="'+t.품명+'">',document.getElementById('modalDetails').innerHTML=[{label:'시즌명',value:t.시즌명},{label:'년도명',value:t.년도명},{label:'기획명',value:t.기획명},{label:'복종명',value:t.복종명},{label:'수입품번',value:t.수입품번},{label:'품번',value:t.품번},{label:'품명',value:t.품명,full:!0},{label:'색상',value:t.색상},{label:'사이즈',value:t.사이즈},{label:'발주처명',value:t.발주처명},{label:'원산지명',value:t.원산지명},{label:'디자이너',value:t.디자이너},{label:'최초가',value:'₩'+formatPrice(t.최초가),highlight:!0},{label:'택가',value:'₩'+formatPrice(t.택가)},{label:'사후원가(V+)',value:'₩'+formatPrice(t['사후원가(V+)'])},{label:'최초입고일',value:t.최초입고일},{label:'최초출고일',value:t.최초출고일}].map(e=>'<div class="detail-group '+(e.full?'full':'')+' "><div class="detail-label">'+e.label+'</div><div class="detail-value '+(e.highlight?'highlight':'')+'">'+( e.value||'-')+'</div></div>').join(''),document.getElementById('detailModal').classList.add('active'),document.body.style.overflow='hidden'}
    function closeModal(){document.getElementById('detailModal').classList.remove('active'),document.body.style.overflow='auto'}
    document.getElementById('detailModal').addEventListener('click',e=>{'detailModal'===e.target.id&&closeModal()}),document.addEventListener('keydown',e=>{'Escape'===e.key&&closeModal()}),window.addEventListener('load',loadData);
  </script>
</body>
</html>
