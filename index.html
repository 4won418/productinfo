<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 정보 맵</title>
  <style>
    :root {
      --color-base: #111111;
      --color-bg: #F7F8FA;
      --color-card: #FFFFFF;
      --color-border: #E5E7EB;
      --color-text: #333333;
      --color-text-light: #666666;
      --status-primary: #2563EB;
      --status-primary-bg: #EAF1FE;
      --status-success: #1B9E5A;
      --radius-card: 12px;
      --radius-input: 8px;
      --shadow-light: 0 2px 8px rgba(17, 17, 17, 0.08);
      --shadow-medium: 0 6px 18px rgba(17, 17, 17, 0.12);
      --sp-8: 8px;
      --sp-12: 12px;
      --sp-16: 16px;
      --sp-24: 24px;
      --sp-32: 32px;
      --font-stack: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-stack);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }

    /* ========== TOP NAV ========== */
    .topnav {
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
      padding: var(--sp-24);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-light);
    }

    .topnav-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 var(--sp-24) 0;
      color: var(--color-base);
    }

    /* ========== FILTERS & SEARCH ========== */
    .filter-section {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-24);
      margin-bottom: var(--sp-24);
      align-items: flex-start;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
      min-width: 240px;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .multi-select {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-8);
      max-height: 120px;
      overflow-y: auto;
      padding: var(--sp-8);
      background: #FAFBFC;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-input);
    }

    .multi-select-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .multi-select-item:hover {
      background: var(--status-primary-bg);
      border-color: var(--status-primary);
    }

    .multi-select-item.active {
      background: var(--status-primary);
      color: white;
      border-color: var(--status-primary);
    }

    .multi-select-item input[type="checkbox"] {
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--status-primary);
    }

    .search-section {
      display: flex;
      align-items: center;
      gap: var(--sp-8);
      flex: 1;
      min-width: 250px;
    }

    .search-input {
      flex: 1;
      padding: 10px var(--sp-12);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-input);
      font-family: inherit;
      font-size: 13px;
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--status-primary);
      box-shadow: 0 0 0 3px var(--status-primary-bg);
    }

    .search-icon {
      color: var(--color-text-light);
      font-size: 16px;
    }

    /* ========== MAIN CONTENT ========== */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--sp-24);
    }

    .results-info {
      font-size: 13px;
      color: var(--color-text-light);
      margin-bottom: var(--sp-16);
      padding: var(--sp-12) var(--sp-16);
      background: #FAFBFC;
      border-radius: var(--radius-input);
      border-left: 3px solid var(--status-primary);
    }

    .results-info strong {
      color: var(--color-text);
      font-weight: 600;
    }

    /* ========== PRODUCT GRID ========== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--sp-16);
    }

    .product-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-light);
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-medium);
      border-color: var(--status-primary);
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #F5F5F5 0%, #EEEEEE 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 12px;
      color: #999;
      position: relative;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .product-card:hover .product-image img {
      transform: scale(1.05);
    }

    .product-image.no-image::after {
      content: "이미지 없음";
      position: absolute;
      font-size: 12px;
      color: #999;
    }

    .product-info {
      padding: var(--sp-16);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-sku {
      font-size: 11px;
      color: var(--status-primary);
      font-weight: 600;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .product-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
      color: var(--color-base);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .product-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--color-text-light);
      margin-bottom: var(--sp-12);
    }

    .product-meta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-meta-label {
      font-weight: 500;
      color: #888;
    }

    .product-meta-value {
      font-weight: 600;
      color: var(--color-text);
      text-align: right;
    }

    .product-price {
      padding-top: var(--sp-12);
      border-top: 1px solid var(--color-border);
      font-size: 16px;
      font-weight: 700;
      color: var(--status-primary);
    }

    /* ========== MODAL/POPUP ========== */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s;
      overflow-y: auto;
      padding: var(--sp-24);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background-color: var(--color-card);
      padding: var(--sp-24);
      border-radius: var(--radius-card);
      max-width: 900px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: var(--shadow-medium);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--sp-24);
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--sp-16);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-base);
      margin: 0;
      flex: 1;
      word-break: break-word;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--color-text-light);
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-close:hover {
      color: var(--color-base);
    }

    .modal-body {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: var(--sp-24);
    }

    .modal-image {
      width: 220px;
      aspect-ratio: 1 / 1;
      background: #F5F5F5;
      border-radius: var(--radius-card);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 10px;
    }

    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-16) var(--sp-24);
    }

    .detail-group {
      display: flex;
      flex-direction: column;
      gap: var(--sp-8);
    }

    .detail-group.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 14px;
      color: var(--color-text);
      word-break: break-word;
      font-weight: 500;
      line-height: 1.5;
    }

    .detail-value.highlight {
      font-size: 16px;
      font-weight: 700;
      color: var(--status-primary);
    }

    /* ========== LOADING & EMPTY STATE ========== */
    .loading {
      text-align: center;
      padding: var(--sp-48);
      color: var(--color-text-light);
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--status-primary-bg);
      border-top-color: var(--status-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: var(--sp-16);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: var(--sp-48);
      color: var(--color-text-light);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: var(--sp-16);
    }

    .empty-state-text {
      font-size: 16px;
      font-weight: 500;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1024px) {
      .filter-section {
        gap: var(--sp-16);
      }

      .filter-group {
        min-width: 200px;
      }

      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .topnav {
        padding: var(--sp-16);
      }

      .topnav-title {
        font-size: 18px;
        margin-bottom: var(--sp-16);
      }

      .filter-section {
        flex-direction: column;
        gap: var(--sp-12);
      }

      .filter-group {
        width: 100%;
        min-width: auto;
      }

      .multi-select {
        width: 100%;
      }

      .search-section {
        width: 100%;
      }

      .products-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: var(--sp-12);
      }

      .modal-body {
        grid-template-columns: 1fr;
      }

      .modal-image {
        width: 100%;
        max-width: 300px;
        margin: 0 auto;
        position: static;
      }

      .modal-details {
        grid-template-columns: 1fr;
      }

      .modal-content {
        width: 95%;
        padding: var(--sp-16);
      }
    }
  </style>
</head>
<body>
  <!-- TOP NAV -->
  <div class="topnav">
    <div class="topnav-title">📦 상품 정보 맵</div>

    <!-- FILTERS & SEARCH -->
    <div class="filter-section">
      <!-- Season Filter -->
      <div class="filter-group">
        <label class="filter-label">🗓️ 시즌</label>
        <div class="multi-select" id="seasonFilter"></div>
      </div>

      <!-- Planning Filter -->
      <div class="filter-group">
        <label class="filter-label">🎯 기획명</label>
        <div class="multi-select" id="planningFilter"></div>
      </div>

      <!-- Category Filter -->
      <div class="filter-group">
        <label class="filter-label">📂 복종명</label>
        <div class="multi-select" id="categoryFilter"></div>
      </div>

      <!-- Search -->
      <div class="search-section" style="flex-direction: column; align-items: stretch;">
        <label class="filter-label">🔍 검색</label>
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="수입품번, 품번, 품명, 기획명, 복종명..."
        >
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main>
    <div class="results-info">
      총 <strong id="totalCount">0</strong>개 상품 중 <strong id="filteredCount">0</strong>개 표시
    </div>

    <!-- PRODUCTS GRID -->
    <div class="products-grid" id="productsGrid"></div>

    <!-- LOADING STATE -->
    <div class="loading" id="loadingState">
      <div class="loading-spinner"></div>
      <div>상품 데이터를 불러오는 중...</div>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">📭</div>
      <div class="empty-state-text">검색 결과가 없습니다.</div>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-image" id="modalImage"></div>
        <div class="modal-details" id="modalDetails"></div>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let filteredProducts = [];

    let filters = {
      seasons: new Set(),
      plannings: new Set(),
      categories: new Set(),
      search: ''
    };

    // GitHub Pages에서 로드하는 경우와 로컬 환경 모두 지원
    const isGitHub = window.location.hostname.includes('github.io');
    const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/4won418/productinfo/main';
    const IMAGE_BASE_PATH = isGitHub
      ? `${GITHUB_RAW_URL}/상품기초정보_2024_2026`
      : './상품기초정보_2024_2026';

    // 데이터 로드
    async function loadData() {
      try {
        // JSON 데이터 로드 (GitHub 또는 로컬)
        let jsonUrl = isGitHub
          ? `${GITHUB_RAW_URL}/product_data.json`
          : './product_data.json';

        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        allProducts = await response.json();
        console.log(`✓ ${allProducts.length}개 상품 로드됨`);

        initializeFilters();
        applyFilters();
      } catch (error) {
        console.error('데이터 로드 실패:', error);
        document.getElementById('loadingState').innerHTML = `
          <div class="empty-state-icon">⚠️</div>
          <div style="text-align: left; line-height: 1.8; padding: 20px;">
            <strong>데이터를 로드할 수 없습니다.</strong><br><br>
            <strong style="color: #2563EB;">GitHub에서 바로 사용하세요:</strong><br>
            <a href="https://github.com/YOUR_USERNAME/product-map" style="color: #2563EB; text-decoration: underline;" target="_blank">
              https://YOUR_USERNAME.github.io/product-map
            </a><br><br>
            또는 로컬에서 HTTP 서버를 실행하세요:<br><br>
            <code style="background: #f0f0f0; padding: 10px; display: block; border-radius: 4px; font-family: monospace;">python -m http.server 8000</code><br>
            그 후 <code style="background: #f0f0f0; padding: 2px 6px;">http://localhost:8000</code>에 접속
          </div>
        `;
      }
    }

    // 필터 초기화
    function initializeFilters() {
      const seasons = [...new Set(allProducts.map(p => p.시즌명).filter(Boolean))].sort();
      const plannings = [...new Set(allProducts.map(p => p.기획명).filter(Boolean))].sort();
      const categories = [...new Set(allProducts.map(p => p.복종명).filter(Boolean))].sort();

      renderFilter('seasonFilter', seasons, 'seasons');
      renderFilter('planningFilter', plannings, 'plannings');
      renderFilter('categoryFilter', categories, 'categories');

      document.getElementById('loadingState').style.display = 'none';
    }

    // 필터 렌더링
    function renderFilter(containerId, items, filterKey) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <label class="multi-select-item" data-value="${item}">
          <input
            type="checkbox"
            value="${item}"
            onchange="toggleFilter('${filterKey}', '${item}', this.checked)"
          >
          <span>${item}</span>
        </label>
      `).join('');
    }

    // 필터 토글
    function toggleFilter(filterKey, value, checked) {
      if (checked) {
        filters[filterKey].add(value);
        document.querySelector(`[data-value="${value}"]`).classList.add('active');
      } else {
        filters[filterKey].delete(value);
        document.querySelector(`[data-value="${value}"]`).classList.remove('active');
      }
      applyFilters();
    }

    // 검색 입력
    document.getElementById('searchInput').addEventListener('input', (e) => {
      filters.search = e.target.value.toLowerCase().trim();
      applyFilters();
    });

    // 필터 적용
    function applyFilters() {
      filteredProducts = allProducts.filter(product => {
        // 필터 조건 확인
        if (filters.seasons.size > 0 && !filters.seasons.has(product.시즌명)) return false;
        if (filters.plannings.size > 0 && !filters.plannings.has(product.기획명)) return false;
        if (filters.categories.size > 0 && !filters.categories.has(product.복종명)) return false;

        // 검색 조건 확인
        if (filters.search) {
          const searchFields = [
            product.수입품번,
            product.품번,
            product.품명,
            product.기획명,
            product.복종명
          ];
          const matches = searchFields.some(field =>
            field && field.toLowerCase().includes(filters.search)
          );
          if (!matches) return false;
        }

        return true;
      });

      updateResults();
    }

    // 결과 업데이트
    function updateResults() {
      const grid = document.getElementById('productsGrid');
      const emptyState = document.getElementById('emptyState');

      document.getElementById('totalCount').textContent = allProducts.length;
      document.getElementById('filteredCount').textContent = filteredProducts.length;

      if (filteredProducts.length === 0) {
        grid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      emptyState.style.display = 'none';

      grid.innerHTML = filteredProducts.map((product, idx) => {
        const seasonFolder = product.시즌명.replace('/', '');
        const imageFile = `${IMAGE_BASE_PATH}/${seasonFolder}/${product.품번}.jpg`;

        return `
          <div class="product-card" onclick="openModal(${idx})">
            <div class="product-image" id="img-${idx}">
              <img src="${imageFile}" alt="${product.품명}" onerror="this.parentElement.classList.add('no-image'); this.style.display='none'">
            </div>
            <div class="product-info">
              <div class="product-sku">${product.수입품번}</div>
              <div class="product-name">${product.품명}</div>
              <div class="product-meta">
                <div class="product-meta-item">
                  <span class="product-meta-label">기획</span>
                  <span class="product-meta-value">${product.기획명}</span>
                </div>
                <div class="product-meta-item">
                  <span class="product-meta-label">복종</span>
                  <span class="product-meta-value">${product.복종명}</span>
                </div>
              </div>
              <div class="product-price">₩${formatPrice(product.최초가)}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 가격 포맷팅
    function formatPrice(price) {
      if (!price || price === '') return '0';
      const numPrice = parseInt(price);
      return isNaN(numPrice) ? '0' : numPrice.toLocaleString('ko-KR');
    }

    // 모달 열기
    function openModal(index) {
      const product = filteredProducts[index];
      const seasonFolder = product.시즌명.replace('/', '');
      const imageFile = `${IMAGE_BASE_PATH}/${seasonFolder}/${product.품번}.jpg`;

      document.getElementById('modalTitle').textContent = product.품명;
      document.getElementById('modalImage').innerHTML = `
        <img src="${imageFile}" alt="${product.품명}" onerror="this.parentElement.textContent='이미지 없음'">
      `;

      // 상세 정보 렌더링
      const detailsHtml = renderDetailGroups(product);
      document.getElementById('modalDetails').innerHTML = detailsHtml;

      document.getElementById('detailModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // 상세 정보 렌더링
    function renderDetailGroups(product) {
      const details = [
        { label: '시즌명', value: product.시즌명 },
        { label: '년도명', value: product.년도명 },
        { label: '기획명', value: product.기획명 },
        { label: '복종명', value: product.복종명 },
        { label: '수입품번', value: product.수입품번 },
        { label: '품번', value: product.품번 },
        { label: '품명', value: product.품명, full: true },
        { label: '색상', value: product.색상 },
        { label: '사이즈', value: product.사이즈 },
        { label: '발주처명', value: product.발주처명 },
        { label: '원산지명', value: product.원산지명 },
        { label: '디자이너', value: product.디자이너 },
        { label: '최초가', value: `₩${formatPrice(product.최초가)}`, highlight: true },
        { label: '택가', value: `₩${formatPrice(product.택가)}` },
        { label: '사후원가(V+)', value: `₩${formatPrice(product['사후원가(V+)'])}` },
        { label: '최초입고일', value: product.최초입고일 },
        { label: '최초출고일', value: product.최초출고일 }
      ];

      return details.map(detail => {
        const fullClass = detail.full ? 'full' : '';
        const highlightClass = detail.highlight ? 'highlight' : '';
        return `
          <div class="detail-group ${fullClass}">
            <div class="detail-label">${detail.label}</div>
            <div class="detail-value ${highlightClass}">${detail.value || '-'}</div>
          </div>
        `;
      }).join('');
    }

    // 모달 닫기
    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    // 모달 바깥쪽 클릭 시 닫기
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    });

    // Escape 키로 모달 닫기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    // 초기화
    window.addEventListener('load', loadData);
  </script>
</body>
</html>
